allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

def ensureAndroidNamespace = { project ->
    def androidExtension = project.extensions.findByName("android")
    if (androidExtension == null || !androidExtension.hasProperty("namespace")) {
        return
    }

    def hasNamespace = androidExtension.namespace != null && androidExtension.namespace.toString().trim()
    if (hasNamespace) {
        return
    }

    def manifestPackage
    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
    if (manifestFile.exists()) {
        def matcher = (manifestFile.getText("UTF-8") =~ /package="([^"]+)"/)
        if (matcher.find()) {
            manifestPackage = matcher.group(1)
        }
    }

    if (manifestPackage == null || manifestPackage.trim().isEmpty()) {
        def fallbackGroup = project.group?.toString()
        if (fallbackGroup == null || fallbackGroup == "unspecified" || !fallbackGroup.contains(".")) {
            fallbackGroup = "dev.flutter.${project.name.replaceAll(/[^A-Za-z0-9_]/, "_")}"
        }
        manifestPackage = fallbackGroup
    }

    androidExtension.namespace = manifestPackage
}

subprojects { project ->
    project.pluginManager.withPlugin("com.android.application") {
        ensureAndroidNamespace(project)
    }
    project.pluginManager.withPlugin("com.android.library") {
        ensureAndroidNamespace(project)
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
