name: yoyo_player
description: yoyo_player is a video player that allows you to select HLS video
  streaming by selecting the quality
version: 0.1.0
homepage: https://github.com/ko-htut/yoyo-player.git

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.4.0
  visibility_detector: ^0.4.0+2
  flutter_widget_from_html_core: ^0.17.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jhomlala.better_player
        pluginClass: BetterPlayerPlugin
      ios:
        pluginClass: FLTBetterPlayerPlugin
